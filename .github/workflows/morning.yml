name: telegram-morning

on:
  schedule:
    # Every 2 hours (GitHub cron is UTC; that's fine). Each run checks the local
    # time in config.yaml's `timezone` (DST-safe) and sends only inside
    # [send_time, send_time + send_window_minutes], once a day. GitHub can delay
    # or skip scheduled runs, so keep the window wide enough for 2-3 runs.
    # Minute 17 avoids GitHub's busy top of the hour. ~12 runs/day ≈ 360 min/month.
    - cron: "17 */2 * * *"
  push:
    # A push that changes the bot or its config only validates config.yaml
    # (--check). It never sends.
    branches: [master, main]
    paths:
      - ".github/workflows/morning.yml"
      - "config.yaml"
      - "telegram_morning/**"
      - "poetry.lock"
  workflow_dispatch:
    inputs:
      force:
        description: "Send a message right now (tick this when testing by hand)"
        type: boolean
        default: false
      character:
        description: "Character id for this run, e.g. quijote (empty = usual pick)"
        type: string
        default: ""

concurrency:
  group: telegram-morning
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Persist the once-per-day guard (state/last_sent.json) across runs.
      - uses: actions/cache@v6
        with:
          path: state
          key: telegram-morning-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: telegram-morning-state-

      - run: pipx install poetry

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: poetry

      - run: poetry install --only main --no-root

      - name: Run telegram_morning
        run: |
          args=()
          if [ "$EVENT" = "push" ]; then args+=(--check); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$CHARACTER" ]; then args+=(--character "$CHARACTER"); fi
          echo "trigger: $EVENT  args: ${args[*]}"
          poetry run python -m telegram_morning.main "${args[@]}"
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          CHARACTER: ${{ inputs.character }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
