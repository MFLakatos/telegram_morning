name: telegram-morning

# Triggers
#   workflow_dispatch: started by an outside timer (cron-job.org) through
#     GitHub's API at 07:00 and 09:00 local time, or by hand from the Actions
#     tab. The program checks the local time (config.yaml `timezone`, DST-safe)
#     and sends only inside [send_time, send_time + send_window_minutes], once
#     per day. The 09:00 call is a backup and stops in seconds if 07:00 sent.
#   push: runs the tests and validates config.yaml. Never sends.
#
# Why not GitHub's own `schedule:` trigger? It costs nothing to set up, but on
# a small repo GitHub delayed or silently dropped most scheduled runs. To use it
# anyway (hours are UTC), add under `on:`
#   schedule:
#     - cron: "5 10,12 * * *"
on:
  push:
    # A push that changes the bot or its config only validates config.yaml
    # (--check). It never sends.
    branches: [master, main]
    paths:
      - ".github/workflows/morning.yml"
      - "config.yaml"
      - "telegram_morning/**"
      - "tests/**"
      - "poetry.lock"
  workflow_dispatch:
    inputs:
      force:
        description: "Send a message right now (tick this when testing by hand)"
        type: boolean
        default: false
      character:
        description: "Character id for this run, e.g. quijote (empty = usual pick)"
        type: string
        default: ""

concurrency:
  group: telegram-morning
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Persist the once-per-day guard (state/last_sent.json) across runs.
      - uses: actions/cache@v6
        with:
          path: state
          key: telegram-morning-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: telegram-morning-state-

      - run: pipx install poetry

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: poetry

      - run: poetry install --no-root ${{ github.event_name != 'push' && '--only main' || '' }}

      # On push: run the tests too (they check config.yaml and that the cron
      # hours above still land inside the send window). A failure shows as ❌.
      - name: Tests
        if: github.event_name == 'push'
        run: poetry run python -m pytest -q

      - name: Run telegram_morning
        run: |
          args=()
          if [ "$EVENT" = "push" ]; then args+=(--check); fi
          if [ "$FORCE" = "true" ]; then args+=(--force); fi
          if [ -n "$CHARACTER" ]; then args+=(--character "$CHARACTER"); fi
          echo "trigger: $EVENT  args: ${args[*]}"
          poetry run python -m telegram_morning.main "${args[@]}"
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
          CHARACTER: ${{ inputs.character }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
